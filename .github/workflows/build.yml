name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Verifica struttura progetto
        run: |
          echo "=== File presenti nel repository ==="
          find . -path ./.git -prune -o -type f -print | sort
          if [ ! -f "settings.gradle" ]; then
            echo "::error::MANCA settings.gradle alla radice del repo!"
            exit 1
          fi
          if [ ! -f "app/build.gradle" ]; then
            echo "::error::MANCA app/build.gradle — struttura delle cartelle errata."
            exit 1
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Carica APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Streaming-Italy-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
